# Publish revised builds under v2 to isolate existing consumers; refresh runs collect candidates without publishing.
name: Build and Publish Native Schema Registry

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      metadata_mode:
        description: Reuse committed metadata, or refresh it without publishing images
        type: choice
        options: [build, refresh]
        default: build

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/v2/schema-registry-native
  INSTRUMENTED_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/v2/schema-registry-instrumented

jobs:
  build:
    name: Build ${{ matrix.version }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        version: ["8.2.0", "8.3.2"]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone both Schema Registry branches
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/spockz/schema-registry.git schema-registry
          git -C schema-registry branch 8.2.0-native origin/8.2.0-native
          git -C schema-registry branch native-8.3.2 origin/native-8.3.2

      - name: Set up Oracle GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25.0.4"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ runner.arch }}-maven-${{ matrix.version }}-${{ hashFiles('native-workflow/*.py') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-maven-${{ matrix.version }}-

      - name: Build and test deployment images
        shell: bash
        env:
          RELEASE_VERSION: ${{ matrix.version }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          METADATA_MODE: ${{ inputs.metadata_mode || 'build' }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s native-workflow/tests
          python3 native-workflow/build_images.py \
            --schema-repo schema-registry \
            --version "$RELEASE_VERSION" \
            --platform "$TARGET_PLATFORM" \
            --metadata-mode "$METADATA_MODE" \
            --image-name "${IMAGE_NAME,,}" \
            --instrumented-image-name "${INSTRUMENTED_IMAGE_NAME,,}"

      - name: Upload build provenance and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-registry-${{ matrix.version }}-${{ matrix.arch }}
          path: |
            artifacts/native-images/images.json
            artifacts/native-images/**/provenance.json
            artifacts/native-images/**/result.json
            artifacts/native-images/**/smoke.json
            artifacts/native-images/**/*.log
            artifacts/native-images/**/upstream-tests/**/results.xml
            artifacts/native-images/**/metadata/*.json
            artifacts/native-images/**/committed-metadata/**/*.json
            artifacts/native-images/**/native/reachability/**/*
            artifacts/native-images/**/schema-registry.native
            native-workflow/metadata/**
          if-no-files-found: warn

      - name: Log in to GHCR
        if: inputs.metadata_mode != 'refresh'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified architecture images
        if: inputs.metadata_mode != 'refresh'
        shell: bash
        env:
          RELEASE_VERSION: ${{ matrix.version }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker push "${IMAGE_NAME,,}:$RELEASE_VERSION-$TARGET_ARCH"
          docker push "${INSTRUMENTED_IMAGE_NAME,,}:$RELEASE_VERSION-$TARGET_ARCH"

  publish-manifest:
    name: Publish ${{ matrix.version }} multi-arch images
    needs: build
    if: inputs.metadata_mode != 'refresh'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        version: ["8.2.0", "8.3.2"]
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push version manifests
        shell: bash
        env:
          RELEASE_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          for image in "${IMAGE_NAME,,}" "${INSTRUMENTED_IMAGE_NAME,,}"; do
            tags=(--tag "$image:$RELEASE_VERSION")
            if [[ "$RELEASE_VERSION" == "8.3.2" ]]; then
              tags+=(--tag "$image:latest")
            fi
            docker buildx imagetools create "${tags[@]}" \
              "$image:$RELEASE_VERSION-amd64" \
              "$image:$RELEASE_VERSION-arm64"
          done
