name: Build and Publish Native Schema Registry

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/schema-registry-native
  INSTRUMENTED_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/kafka-schema-registry-graalvm-instrumented
  VERSION: 8.2.0

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone schema-registry
        run: git clone https://github.com/spockz/schema-registry.git -b 8.2.0-native

      - name: Set up Oracle GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25.0.2"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ runner.arch }}-maven-${{ hashFiles('schema-registry/**/pom.xml') }}
          save-always: true
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-maven-

      - name: Build native binary
        working-directory: schema-registry
        run: |
          ./mvnw versions:set -DnewVersion=8.2.0
          ./mvnw clean package -Pstandalone,native -pl package-schema-registry/ "-Dio.confluent.schema-registry.version=8.2.0"

      - name: Stage binary
        run: |
          cp schema-registry/package-schema-registry/target/kafka-schema-registry-package \
             schema-registry-native-${{ env.VERSION }}-${{ matrix.arch }}
          cp schema-registry-native-${{ env.VERSION }}-${{ matrix.arch }} \
             native-image/kafka-schema-registry-package

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: schema-registry-native-${{ env.VERSION }}-${{ matrix.arch }}
          path: schema-registry-native-${{ env.VERSION }}-${{ matrix.arch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arch-specific image
        uses: docker/build-push-action@v6
        with:
          context: native-image
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ matrix.arch }}

  build-instrumented:
    name: Build instrumented (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arch-specific instrumented image
        uses: docker/build-push-action@v6
        with:
          context: instrument
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.INSTRUMENTED_IMAGE_NAME }}:${{ env.VERSION }}-${{ matrix.arch }}

  publish-manifest:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
            --tag ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}-amd64 \
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}-aarch64

  publish-manifest-instrumented:
    name: Publish multi-arch instrumented manifest
    needs: build-instrumented
    runs-on: ubuntu-24.04
    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch instrumented manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.INSTRUMENTED_IMAGE_NAME }}:${{ env.VERSION }} \
            --tag ${{ env.INSTRUMENTED_IMAGE_NAME }}:latest \
            ${{ env.INSTRUMENTED_IMAGE_NAME }}:${{ env.VERSION }}-amd64 \
            ${{ env.INSTRUMENTED_IMAGE_NAME }}:${{ env.VERSION }}-aarch64
